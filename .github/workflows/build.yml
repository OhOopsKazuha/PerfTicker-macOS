name: macOS ARM64 build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build ARM64 application
        run: bash Source/build.sh
      - name: Validate bundle and real samples
        run: bash scripts/check.sh
      - name: Package preview
        run: bash scripts/package.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PerfTicker-macOS-arm64-preview
          path: |
            dist/PerfTicker-macOS-*-arm64.zip
            dist/SHA256SUMS.txt
          retention-days: 7
