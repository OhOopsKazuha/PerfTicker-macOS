name: Bug report / 问题报告
description: 提交可复现的问题（请移除个人信息）
title: "[Bug] "
body:
  - type: input
    id: environment
    attributes:
      label: 环境 / Environment
      description: 芯片、macOS 版本、应用版本
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤与实际行为
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
  - type: checkboxes
    id: privacy
    attributes:
      label: 附件隐私
      options:
        - label: 已移除用户名、个人路径、真实进程列表及其他敏感信息
          required: true
